<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS em Listas e Tabelas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Exemplo de Listas</h2>
    <ul class="lista1">
        <li>Alfa auuuuuuuu</li>
        <li>Beta grrrr</li>
    </ul>
    <ol class="lista2">
        <!--TESTANDO FONTES E ESCREVENDO QUALQUER COISA-->
        <h2>DEUSES ROMANOS PREFERIDOS</h2>
        <li>Vênus</li>
        <li>Todos os outros</li>
    </ol>
    <ul class="lista3">
        <li>Item com marcador de imagem</li>
        <li>Mais um item</li>
    </ul>

    <h2>Exemplo de Tabela</h2>
    <table class="tabela">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Paulo Helder</td>
            <td>19</td>
            <td>Alagoinhas</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>30</td>
            <td>Recife</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>28</td>
            <td>Fortaleza</td>
        </tr>
    </table>

</body>

</html>
